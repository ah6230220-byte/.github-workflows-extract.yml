name: Extract ZIP Project

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP and keep structure
        run: |
          find . -name "*.zip" -print0 | while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -o "$file" -d .
          done
          find . -name "*.zip" -delete

      - name: Commit everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ZIP with full folder structure" || echo "Nothing to commit"
          git push
